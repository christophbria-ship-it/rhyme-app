name = "rhymer-ai"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[ai]
binding = "AI"

[vars]
ALLOWED_ORIGINS = "https://christophbria-ship-it.github.io"
MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# Workers Cache: GET responses with Cache-Control are cached at the edge (repeat requests cost no AI quota)
[cache]
enabled = true
